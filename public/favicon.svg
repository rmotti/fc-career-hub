<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="28%" r="55%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield-fill" x1="32" y1="8" x2="32" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16291a"/>
      <stop offset="100%" stop-color="#0d1a10"/>
    </linearGradient>
    <linearGradient id="stroke-grad" x1="12" y1="8" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="64" height="64" rx="14" fill="#0b1118"/>
  <!-- Subtle green ambient glow behind shield -->
  <rect width="64" height="64" rx="14" fill="url(#bg-glow)"/>

  <!-- Shield body -->
  <path
    d="M12 9 H52 V35 C52 47 43 55.5 32 59.5 C21 55.5 12 47 12 35 Z"
    fill="url(#shield-fill)"
    stroke="url(#stroke-grad)"
    stroke-width="1.6"
    stroke-linejoin="round"
  />

  <!-- Subtle inner shield highlight -->
  <path
    d="M15 12 H49 V35 C49 45 41.5 52.5 32 56 C22.5 52.5 15 45 15 35 Z"
    fill="#22c55e"
    fill-opacity="0.05"
  />

  <!-- Top shield edge accent (brighter top corners) -->
  <path
    d="M12 9 H52"
    stroke="#4ade80"
    stroke-width="1.6"
    stroke-opacity="0.6"
    stroke-linecap="round"
  />

  <!-- Pitch: halfway line -->
  <line x1="12" y1="33" x2="52" y2="33" stroke="#22c55e" stroke-width="0.9" stroke-opacity="0.38"/>

  <!-- Pitch: center circle -->
  <circle cx="32" cy="33" r="10.5" stroke="#22c55e" stroke-width="1.1" stroke-opacity="0.6" fill="none"/>

  <!-- Center spot outer glow -->
  <circle cx="32" cy="33" r="5" fill="url(#spot-glow)"/>

  <!-- Center spot -->
  <circle cx="32" cy="33" r="2.4" fill="#4ade80"/>

  <!-- Small top-center crown detail -->
  <path d="M28 9 L32 5.5 L36 9" stroke="#4ade80" stroke-width="1.4" stroke-opacity="0.5" stroke-linejoin="round" fill="none"/>
</svg>
